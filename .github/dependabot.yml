version: 2
updates:
  - package-ecosystem: maven
    directory: "/" # pom.xml file is in the project root folder
    schedule:
      interval: "weekly"
    groups:
      maven-dependencies:
        patterns:
          - '*'
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 25 # Maximum number of open pull requests
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
