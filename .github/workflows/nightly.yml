name: Nightly

# Catches upstream API changes that no commit would trigger
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # verify = compile + unit tests + integration tests (*IT.java against live APIs) + package
      - name: Build and run all tests
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          KEY_DICTIONARY: ${{ secrets.KEY_DICTIONARY }}
          KEY_THESAURUS: ${{ secrets.KEY_THESAURUS }}
        run: mvn -B verify

      # PlayerManagerIT skips when YouTube walls off the runner IP; repeated warnings can mean a real YouTube change
      - name: Warn on YouTube login wall
        if: always()
        run: |
          if grep -q "YouTube requires login" target/failsafe-reports/*.xml 2>/dev/null; then
            echo "::warning title=YouTube login wall::PlayerManagerIT video test skipped because YouTube required login from this runner"
          fi
