name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compile
        run: mvn -B compile

      - name: Run unit tests
        run: mvn -B test

      - name: Check for non-ASCII characters in Java source
        run: python3 scripts/check_ascii.py

  lint-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          # Conventional Commits: type(optional scope)!: description
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9._/-]+\))?!?: .+'
          fail=0

          while IFS= read -r sha; do
            subject=$(git log -1 --format=%s "$sha")
            body=$(git log -1 --format=%B "$sha")

            echo "Checking $sha: $subject"

            if ! echo "$subject" | grep -qE "$PATTERN"; then
              echo "::error::Commit $sha does not follow Conventional Commits format (type(scope): description): $subject"
              fail=1
            fi

            if printf '%s' "$body" | LC_ALL=C grep -qP '[^\x00-\x7F]'; then
              echo "::error::Commit $sha message contains non-ASCII characters"
              fail=1
            fi
          done < <(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")

          exit $fail
